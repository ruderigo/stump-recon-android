; Stump Dual-Band RF Recon Monitor v0.3.8-MULTIBOARD-TDM
; Strictly Passive / Receive-Only (Zero-TX)
;
; Supported ESP32-S3 + SX1262 Targets:
;   1. Heltec WiFi LoRa 32 V3 / V3.2 : pio run -e heltec_wifi_lora_32_V3
;   2. LilyGO T3-S3 (SX1262)         : pio run -e lilygo_t3_s3_sx1262
;   3. LilyGO T-Beam Supreme (SX1262): pio run -e lilygo_tbeam_supreme_sx1262
;
; Each build automatically produces a single flashable merged factory binary at:
;   .pio/build/<env>/stump_<env>_merged.bin
; Copy that .bin to your Android phone and flash directly over USB-OTG!

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    jgromes/RadioLib@7.1.2
extra_scripts = post:scripts/merge_bin.py

[env:heltec_wifi_lora_32_V3]
board = heltec_wifi_lora_32_V3
build_flags =
    -D STUMP_FW_VERSION=\"0.3.8-HELTEC-V3-TDM\"
    -D STUMP_BOARD_HELTEC_V3=1
    -D STUMP_TCXO_V=1.8
    -D CORE_DEBUG_LEVEL=0

[env:lilygo_t3_s3_sx1262]
board = lilygo-t3-s3
build_flags =
    -D STUMP_FW_VERSION=\"0.3.8-T3S3-TDM\"
    -D STUMP_BOARD_T3_S3=1
    -D STUMP_TCXO_V=1.8
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0

[env:lilygo_tbeam_supreme_sx1262]
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
build_flags =
    -D STUMP_FW_VERSION=\"0.3.8-TBEAM-SUPREME-TDM\"
    -D STUMP_BOARD_TBEAM_SUPREME=1
    -D STUMP_TCXO_V=1.8
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0
