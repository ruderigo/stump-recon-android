name: Build STUMP Recon Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run RNS 1.6 / LXMF 1.3 / SLIP Parity Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Package APK
        run: |
          VER="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/debug/app-debug.apk "stump-recon-android-${VER}.apk"

      - name: Upload Sideloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stump-recon-android-apk
          path: stump-recon-android-*.apk

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="stump-recon-android-${TAG}.apk"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${APK}" --clobber
          else
            gh release create "${TAG}" "${APK}" \
              --title "STUMP Recon Android ${TAG}" \
              --generate-notes
          fi
